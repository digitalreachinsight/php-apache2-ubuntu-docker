version: 2.1

orbs:
  docker: circleci/docker@2.8.2

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      # Fixed: Explicitly pass your GHCR authentication variables here
      - docker/check:
          registry: ghcr.io
          username: GHCR_USERNAME
          password: GHCR_PASSWORD

      - docker/build:
          registry: ghcr.io
          image: digitalreachinsight/php-apache2-ubuntu
          tag: "latest,nightly-${CIRCLE_BUILD_NUM}"
          
      - docker/push:
          registry: ghcr.io
          image: digitalreachinsight/php-apache2-ubuntu
          tag: "latest,nightly-${CIRCLE_BUILD_NUM}"

workflows:
  nightly-build:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build-and-push

  manual-push-build:
    jobs:
      - build-and-push:
          filters:
            branches:
              only:
                - master

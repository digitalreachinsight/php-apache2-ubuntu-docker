version: 2.1

# Import the official CircleCI Docker orb to simplify builds and pushes
orbs:
  docker: circleci/docker@2.8.2

jobs:
  build-and-push:
    # Use the machine executor (Ubuntu VM) to support full Docker capabilities natively

    steps:
      - checkout
      
      # Setup remote Docker engine (required if not using machine executor, but kept for compatibility)
      - setup_remote_docker

      # Log in to Docker Hub, build the Dockerfile, and push it
      - docker/check
      - docker/build:
          image: ghcr.io/digitalreachinsight/php-apache2-ubuntu
          tag: "latest,nightly-${CIRCLE_BUILD_NUM}"
      - docker/push:
          image: ghcr.io/digitalreachinsight/php-apache2-ubuntu
          tag: "latest,nightly-${CIRCLE_BUILD_NUM}"

workflows:
  # 1. This workflow runs automatically every night
  nightly-build:
    triggers:
      - schedule:
          cron: "0 0 * * *" # Runs daily at 00:00 UTC (Midnight)
          filters:
            branches:
              only:
                - master # Your repository uses 'master' as its main branch
    jobs:
      - build-and-push

  # 2. This optional workflow ensures a build runs whenever you push code manually (test1)
  manual-push-build:
    jobs:
      - build-and-push:
          filters:
            branches:
              only:
                - master

version: 2.1

# Import the official CircleCI Docker orb to simplify builds and pushes
orbs:
  docker: circleci/docker@2.8.2

jobs:
  build-and-push:
    # 1. Fixed: Define a valid Docker executor environment
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      
      # 2. Fixed: Kept setup_remote_docker safely inside a docker executor
      - setup_remote_docker:
          docker_layer_caching: true

      - docker/check
      
      # 3. Fixed: Added registry config for GHCR & removed the whitespace inside the tag string
      - docker/build:
          registry: ghcr.io
          image: digitalreachinsight/php-apache2-ubuntu
          tag: "latest,nightly-${CIRCLE_BUILD_NUM}"
          
      - docker/push:
          registry: ghcr.io
          image: digitalreachinsight/php-apache2-ubuntu
          tag: "latest,nightly-${CIRCLE_BUILD_NUM}"

workflows:
  nightly-build:
    triggers:
      - schedule:
          cron: "0 0 * * *" # Runs daily at 00:00 UTC
          filters:
            branches:
              only:
                - master
    jobs:
      - build-and-push

  manual-push-build:
    jobs:
      - build-and-push:
          filters:
            branches:
              only:
                - master
